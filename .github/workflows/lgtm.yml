name: Ollama review

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      mode:
        description: Review context
        type: choice
        options: [repository, diff]
        default: repository

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'review_requested' || vars.OLLAMA_REVIEW_AUTO == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ready: ${{ steps.request.outputs.ready }}
      mode: ${{ steps.request.outputs.mode }}
      number: ${{ steps.request.outputs.number }}
      request: ${{ steps.request.outputs.request }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/lgtm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Authorize and acknowledge request
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_REVIEW: ${{ vars.OLLAMA_REVIEW_AUTO }}
          REVIEWER_LOGIN: ${{ vars.OLLAMA_REVIEW_REQUEST_LOGIN }}
        run: node .github/lgtm/review.mjs prepare

  review:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ollama-review-${{ github.repository }}-${{ needs.prepare.outputs.number }}-${{ needs.prepare.outputs.mode }}
      cancel-in-progress: true
    outputs:
      result: ${{ steps.analyze.outputs.result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/lgtm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Install and test pinned runner
        run: |
          npm ci --prefix .github/lgtm --ignore-scripts --no-audit --no-fund
          npm test --prefix .github/lgtm
      - name: Analyze pull request
        id: analyze
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          REVIEW_REQUEST: ${{ needs.prepare.outputs.request }}
        run: node .github/lgtm/review.mjs analyze

  publish:
    needs: [prepare, review]
    if: always() && needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/lgtm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Publish findings and final status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_REQUEST: ${{ needs.prepare.outputs.request }}
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
        run: node .github/lgtm/review.mjs publish
