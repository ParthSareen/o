name: Ollama review

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/review') ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'review_requested' || vars.OLLAMA_REVIEW_AUTO == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.request.outputs.ready }}
      number: ${{ steps.request.outputs.number }}
      request: ${{ steps.request.outputs.request }}
    steps:
      - name: Read trusted review runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ollama-review
      - name: Validate review request
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_REVIEW: ${{ vars.OLLAMA_REVIEW_AUTO }}
          REVIEWER_LOGIN: ${{ vars.OLLAMA_REVIEW_REQUEST_LOGIN }}
        run: python3 .github/ollama-review/review.py prepare --directory "$RUNNER_TEMP/ollama-review"
      - name: Explain skipped or incomplete request
        if: always() && steps.request.outputs.ready != 'true'
        run: python3 .github/ollama-review/review.py summary --directory "$RUNNER_TEMP/ollama-review"

  review:
    needs: authorize
    if: needs.authorize.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ollama-review-${{ github.repository }}-${{ needs.authorize.outputs.number }}
      cancel-in-progress: true
    steps:
      - name: Read trusted review runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ollama-review
      - name: Pull pinned review engine
        run: docker pull --platform linux/amd64 pragent/pr-agent@sha256:10a8893d5e081be1a5ae825843d9fc14f8e8d59d8a4f61d67c1775415156079f
      - name: Analyze pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          REVIEW_REQUEST: ${{ needs.authorize.outputs.request }}
        run: python3 .github/ollama-review/review.py analyze --directory "$RUNNER_TEMP/ollama-review"
      - name: Write review summary
        if: always()
        run: python3 .github/ollama-review/review.py summary --directory "$RUNNER_TEMP/ollama-review"
